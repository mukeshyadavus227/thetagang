name: Sync fork with upstream

on:
  schedule:
    # Runs daily at 06:00 UTC (adjust cron expression as needed)
    - cron: '0 6 * * *'→ Runs at 06:00
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  sync:
    name: Sync fork with brndnmtthws/thetagang
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/brndnmtthws/thetagang.git || true
          git fetch upstream

      - name: Sync main branch with upstream
        run: |
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main --no-edit
          git push origin main
